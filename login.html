<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TravelGo - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <!-- ================= LOGIN NAVBAR ================= -->

    <header class="header">

        <nav class="navbar container">

            <a href="index.html" class="logo">
                Travel<span>Go</span>
            </a>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </nav>

    </header>


    <!-- ================= LOGIN SECTION ================= -->

    <main class="login-section">

        <div class="login-container">


            <!-- Left Side -->

            <div class="login-image">

                <div class="login-overlay"></div>

                <div class="login-image-content">

                    <h1>
                        Welcome Back!
                    </h1>

                    <p>
                        Login to TravelGo and start
                        planning your next unforgettable journey.
                    </p>

                </div>

            </div>


            <!-- Right Side -->

            <div class="login-form-container">

                <div class="login-form-header">

                    <p class="section-subtitle">
                        TRAVELGO
                    </p>

                    <h2>
                        Login to Your Account
                    </h2>

                    <p>
                        Enter your details to continue.
                    </p>

                </div>


                <form id="loginForm" class="login-form">


                    <!-- Email -->

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Remember + Forgot -->

                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="btn login-btn"
                    >
                        Login
                    </button>


                    <!-- Register -->

                    <p class="register-text">

                        Don't have an account?

                        <a href="#" id="registerLink">
                            Create Account
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </main>


    <!-- ================= LOGIN JAVASCRIPT ================= -->

    <script>

        /* -------------------------
           PASSWORD SHOW / HIDE
        ------------------------- */

        const togglePassword =
            document.getElementById("togglePassword");

        const loginPassword =
            document.getElementById("loginPassword");


        togglePassword.addEventListener("click", () => {

            if (loginPassword.type === "password") {

                loginPassword.type = "text";

                togglePassword.textContent = "";

            } else {

                loginPassword.type = "password";

                togglePassword.textContent = "";

            }

        });


        /* -------------------------
           LOGIN FORM
        ------------------------- */

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();


            const email =
                document.getElementById("loginEmail").value;

            const password =
                document.getElementById("loginPassword").value;


            if (email === "" || password === "") {

                alert("Please enter your email and password.");

                return;

            }


            /*
                Demo Login

                This is frontend-only.
                No real database/authentication
                is connected yet.
            */

            alert(
                `Welcome to TravelGo!\n\n` +
                `Login successful for ${email}`
            );


            window.location.href = "index.html";

        });


        /* -------------------------
           FORGOT PASSWORD
        ------------------------- */

        document
            .getElementById("forgotPassword")
            .addEventListener("click", (event) => {

                event.preventDefault();

                alert(
                    "Password reset functionality will be available soon."
                );

            });


        /* -------------------------
           CREATE ACCOUNT
        ------------------------- */

        document
            .getElementById("registerLink")
            .addEventListener("click", (event) => {

                event.preventDefault();

                alert(
                    "Registration page will be available soon."
                );

            });

    </script>

</body>

</html>
